server {
    listen 80;
    listen [::]:80;
    server_name work.pelmon.kro.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /volume1/work-automation/acme;
    }
    location / { return 301 https://work.pelmon.kro.kr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name work.pelmon.kro.kr;
    ssl_certificate /volume1/work-automation/tls/live/work.pelmon.kro.kr/fullchain.pem;
    ssl_certificate_key /volume1/work-automation/tls/live/work.pelmon.kro.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    location /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
